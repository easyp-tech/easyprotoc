name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: |
          go vet ./...
          (cd bench && go vet ./...)

      - name: Test
        run: go test -race ./...

      - name: Build
        run: |
          go build ./cmd/easyprotoc
          GOOS=linux GOARCH=arm GOARM=7 go build ./...
          (cd bench && go build ./...)

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: bench
          args: --config ../.golangci.yml

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Same descriptors as protoc on googleapis
        run: bench/run.sh parity
